<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Event</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Master Event</h1>

        <div class="panel">
            <form id="formEvent">
                <div class="form-group">
                    <label for="judul">Judul Event</label>
                    <input type="text" id="judul" name="judul" placeholder="Masukkan judul event" required>
                </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi</label>
                    <textarea id="deskripsi" name="deskripsi" rows="4" placeholder="Masukkan deskripsi event" required></textarea>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori" required>
                        <option value="" disabled selected>Pilih kategori</option>
                        <option value="Teknologi">Teknologi</option>
                        <option value="Bisnis">Bisnis</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="silabus">Silabus</label>
                    <textarea id="silabus" name="silabus" rows="4" placeholder="Masukkan silabus/materi event" required></textarea>
                </div>

                <div class="form-group">
                    <label for="durasi">Durasi Sesi (menit)</label>
                    <input type="number" id="durasi" name="durasi" min="1" placeholder="Contoh: 90" required>
                    <p class="hint">Durasi dalam satuan menit.</p>
                </div>

                <button type="submit" id="btnSimpan">Simpan Event</button>
                <button type="button" id="btnBatal" class="btn-batal" hidden>Batal edit</button>
                <p class="status" id="status" role="status"></p>
            </form>
        </div>

        <div class="daftar">
            <h2>Daftar Event</h2>
            <div class="tabel-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Judul</th>
                            <th>Kategori</th>
                            <th>Durasi (menit)</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="isiTabel"></tbody>
                </table>
            </div>
            <p class="kosong" id="pesanKosong">Belum ada event. Isi form di atas untuk menambah event pertama.</p>
        </div>
    </div>

    <script>
        // Data disimpan di array biasa (tanpa JSON, tanpa file)
        const events = [];
        let indexEdit = null; // null = mode tambah, angka = mode edit

        const form = document.getElementById('formEvent');
        const status = document.getElementById('status');
        const isiTabel = document.getElementById('isiTabel');
        const pesanKosong = document.getElementById('pesanKosong');
        const btnSimpan = document.getElementById('btnSimpan');
        const btnBatal = document.getElementById('btnBatal');

        function buatSel(teks) {
            const td = document.createElement('td');
            td.textContent = teks;
            return td;
        }

        function tampilkanTabel() {
            isiTabel.innerHTML = '';

            events.forEach(function (ev, i) {
                const tr = document.createElement('tr');

                tr.appendChild(buatSel(i + 1));
                tr.appendChild(buatSel(ev.judul));
                tr.appendChild(buatSel(ev.kategori));
                tr.appendChild(buatSel(ev.durasi));

                const tdAksi = document.createElement('td');
                tdAksi.className = 'aksi';

                const btnEdit = document.createElement('button');
                btnEdit.type = 'button';
                btnEdit.className = 'btn-kecil';
                btnEdit.textContent = 'Edit';
                btnEdit.addEventListener('click', function () { mulaiEdit(i); });

                const btnHapus = document.createElement('button');
                btnHapus.type = 'button';
                btnHapus.className = 'btn-kecil btn-hapus';
                btnHapus.textContent = 'Hapus';
                btnHapus.addEventListener('click', function () { hapusEvent(i); });

                tdAksi.appendChild(btnEdit);
                tdAksi.appendChild(btnHapus);
                tr.appendChild(tdAksi);

                isiTabel.appendChild(tr);
            });

            pesanKosong.hidden = events.length > 0;
        }

        function aturModeTambah() {
            indexEdit = null;
            btnSimpan.textContent = 'Simpan Event';
            btnBatal.hidden = true;
            form.reset();
        }

        function mulaiEdit(i) {
            const ev = events[i];
            indexEdit = i;

            document.getElementById('judul').value = ev.judul;
            document.getElementById('deskripsi').value = ev.deskripsi;
            document.getElementById('kategori').value = ev.kategori;
            document.getElementById('silabus').value = ev.silabus;
            document.getElementById('durasi').value = ev.durasi;

            btnSimpan.textContent = 'Perbarui Event';
            btnBatal.hidden = false;
            status.textContent = '';
            form.scrollIntoView({ behavior: 'smooth' });
        }

        function hapusEvent(i) {
            if (!confirm('Hapus event "' + events[i].judul + '"?')) return;

            events.splice(i, 1);
            if (indexEdit !== null) aturModeTambah();
            tampilkanTabel();

            status.className = 'status ok';
            status.textContent = 'Event dihapus.';
        }

        btnBatal.addEventListener('click', function () {
            aturModeTambah();
            status.textContent = '';
        });

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const dataEvent = {
                judul: document.getElementById('judul').value.trim(),
                deskripsi: document.getElementById('deskripsi').value.trim(),
                kategori: document.getElementById('kategori').value,
                silabus: document.getElementById('silabus').value.trim(),
                durasi: Number(document.getElementById('durasi').value)
            };

            let pesan;
            if (indexEdit === null) {
                events.push(dataEvent);
                pesan = 'Event tersimpan.';
            } else {
                events[indexEdit] = dataEvent;
                pesan = 'Event diperbarui.';
            }

            aturModeTambah();
            tampilkanTabel();

            status.className = 'status ok';
            status.textContent = pesan + ' Total: ' + events.length + ' event.';
        });

        tampilkanTabel();
    </script>
</body>
</html>
